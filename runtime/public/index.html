<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrierenCloud</title><style>
:root{--p:#7253d4;--ink:#182033;--muted:#667085;--bg:#f7f8fc;--line:#e4e7ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}.landing{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 8% 8%,#e8ddff,transparent 30%),radial-gradient(circle at 90% 85%,#d8fff0,transparent 28%),var(--bg)}.hero{max-width:980px;display:grid;grid-template-columns:1fr .85fr;align-items:center;gap:44px}.hero h1{font-size:clamp(44px,7vw,80px);line-height:.95;letter-spacing:-.07em;margin:10px 0}.hero p{font-size:19px;color:var(--muted)}.hero img{width:100%;filter:drop-shadow(0 24px 20px #7253d452)}.tag{font-weight:800;color:var(--p);letter-spacing:.1em;text-transform:uppercase}.primary,.secondary,.logout{padding:11px 14px;border-radius:10px;font-weight:800}.primary{background:var(--p);color:#fff}.secondary{background:#eeeaff;color:#5b42b5}.logout{background:#fff0f0;color:#b73740}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{padding:25px 15px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:24px}.brand{font-size:20px;font-weight:900}.brand b{display:inline-grid;place-items:center;width:29px;height:29px;background:var(--p);color:#fff;border-radius:9px;margin-right:8px}.nav{display:grid;gap:7px}.nav button{background:transparent;text-align:left;padding:11px;border-radius:9px;font-weight:750;color:#4b5568}.nav button.active,.nav button:hover{background:#efebff;color:var(--p)}.side small{margin-top:auto;color:var(--muted)}.main{padding:28px clamp(18px,4vw,52px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}.top h1{margin:0;font-size:28px}.profile{display:flex;align-items:center;gap:9px}.profile img{width:34px;height:34px;border-radius:50%}.coins{background:#eafff2;color:#13764e;padding:7px 9px;border-radius:8px;font-weight:800}.locale{padding:7px;border:1px solid var(--line);border-radius:8px;background:#fff}.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:21px;box-shadow:0 14px 38px #3b32550c}.card h2{margin:0 0 5px;font-size:19px}.sub{color:var(--muted);margin:0 0 16px}.form{display:grid;gap:12px}.field{display:grid;gap:6px;font-weight:700}.field input,.field select{border:1px solid var(--line);padding:10px;border-radius:9px;background:#fff}.vms{display:grid;gap:10px}.vm{border:1px solid var(--line);padding:13px;border-radius:11px;display:flex;justify-content:space-between;gap:9px;align-items:center}.pill{font-size:11px;text-transform:uppercase;font-weight:900;background:#eeeaff;color:#5c44b6;padding:5px 7px;border-radius:20px}.log{margin-top:12px;min-height:150px;max-height:320px;overflow:auto;background:#151827;color:#d0ffe8;padding:12px;border-radius:10px;white-space:pre-wrap;font:12px/1.45 ui-monospace,monospace}.notice{padding:13px;background:#f2f6ff;border-radius:10px;color:#375a91}.empty{text-align:center;color:var(--muted);padding:22px}@media(max-width:720px){.hero{grid-template-columns:1fr;text-align:center}.hero img{max-width:330px;margin:auto}.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:3;padding:12px;flex-direction:row;align-items:center;overflow:auto}.nav{display:flex}.nav button{white-space:nowrap}.side small{display:none}.main{padding:18px 14px}.profile .name{display:none}.grid{grid-template-columns:1fr}.vm{align-items:flex-start;flex-direction:column}}
</style></head><body><main id="root"></main><script>
const words={en:{title:'A calmer way to manage Ubuntu VPS.',tag:'Discord-powered VPS control',login:'Continue with Discord',vps:'VPS Instances',con:'Get Coins (contribute)',daily:'Get Coins (daily)',logout:'Logout',host:'Hostname (optional)',hint:'Leave empty to use frierencloud',ubuntu:'Ubuntu version',create:'Create VPS',view:'View logs',none:'No VPS instances yet.',dailyTitle:'Daily coins',dailyCopy:'Create a secure one-time claim link for your Discord account.',get:'Get daily claim link',conTitle:'Contribution coins',conCopy:'Submit a secondary-account token through Discord. Token values are never displayed on this website.',configured:'Contribution token confirmed',missing:'No contribution token confirmed',command:'Use /token contribute token:<token> in Discord, then press Confirm.',used:'Daily claims used today',creating:'Creating…',ready:'Ready'},vi:{title:'Quản lý Ubuntu VPS một cách nhẹ nhàng.',tag:'Quản lý VPS qua Discord',login:'Đăng nhập bằng Discord',vps:'VPS Instances',con:'Nhận xu (đóng góp)',daily:'Nhận xu (hàng ngày)',logout:'Đăng xuất',host:'Hostname (không bắt buộc)',hint:'Để trống sẽ dùng frierencloud',ubuntu:'Phiên bản Ubuntu',create:'Tạo VPS',view:'Xem log',none:'Chưa có VPS nào.',dailyTitle:'Xu hằng ngày',dailyCopy:'Tạo link nhận xu một lần cho tài khoản Discord của bạn.',get:'Tạo link nhận xu',conTitle:'Xu đóng góp',conCopy:'Gửi token tài khoản GitHub phụ qua Discord. Token không bao giờ hiển thị trên website.',configured:'Contribution token đã xác nhận',missing:'Chưa có contribution token',command:'Dùng /token contribute token:<token> trên Discord rồi bấm Confirm.',used:'Lượt nhận xu hôm nay',creating:'Đang tạo…',ready:'Sẵn sàng'}};let data,tab='vps',timer;const root=document.querySelector('#root');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const t=k=>words[(data&&data.locale)||'en'][k];async function api(u,o={}){let r=await fetch(u,{headers:{'content-type':'application/json',...(o.headers||{})},...o}),b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'Request failed');return b}
function landing(){root.innerHTML=`<section class="landing"><div class="hero"><div><div class="tag">FrierenCloud</div><h1>${t('title')}</h1><p>${t('tag')}</p><button class="primary" onclick="location.href='/auth/discord'">${t('login')}</button></div><img src="/manus-storage/frierencloud-bot-avatar_d0bb8fd1.png" alt="FrierenCloud"></div></section>`}function list(){return data.instances.length?`<div class="vms">${data.instances.map(v=>`<div class="vm"><div><b>${esc(v.hostname)}</b><div class="sub">Ubuntu ${esc(v.ubuntuVersion)} · #${v.id}</div></div><div><span class="pill">${esc(v.status)}</span> <button class="secondary" onclick="logs(${v.id})">${t('view')}</button></div></div>`).join('')}</div>`:`<div class="empty">${t('none')}</div>`}function page(){if(tab==='daily')return `<div class="card"><h2>${t('dailyTitle')}</h2><p class="sub">${t('dailyCopy')}</p><p class="notice">${t('used')}: <b>${data.daily.used}/${data.daily.limit}</b></p><button class="primary" onclick="daily()">${t('get')}</button><p id="result"></p></div>`;if(tab==='con')return `<div class="card"><h2>${t('conTitle')}</h2><p class="sub">${t('conCopy')}</p><p class="notice"><b>${data.contributionConfigured?t('configured'):t('missing')}</b><br>${t('command')}</p></div>`;return `<div class="grid"><div class="card"><h2>${t('vps')}</h2><p class="sub">Ubuntu 22.04 or 24.04 · 2 coins per VPS</p>${list()}<pre id="log" class="log hidden"></pre></div><div class="card"><h2>${t('create')}</h2><form class="form" onsubmit="create(event)"><label class="field">${t('host')}<input id="hostname" maxlength="63" placeholder="frierencloud"><small class="sub">${t('hint')}</small></label><label class="field">${t('ubuntu')}<select id="ubuntu"><option value="24.04">Ubuntu 24.04</option><option value="22.04">Ubuntu 22.04</option></select></label><button id="createButton" class="primary">${t('create')}</button></form><p id="result"></p></div></div>`}function dashboard(){let u=data.user;root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><b>FC</b>FrierenCloud</div><nav class="nav"><button class="${tab==='vps'?'active':''}" onclick="show('vps')">${t('vps')}</button><button class="${tab==='con'?'active':''}" onclick="show('con')">${t('con')}</button><button class="${tab==='daily'?'active':''}" onclick="show('daily')">${t('daily')}</button></nav><small>Node.js · Discord</small></aside><section class="main"><header class="top"><h1>${tab==='vps'?t('vps'):tab==='con'?t('conTitle'):t('dailyTitle')}</h1><div class="profile"><span class="coins">${data.coins} coins</span><select class="locale" onchange="language(this.value)"><option value="en" ${data.locale==='en'?'selected':''}>EN</option><option value="vi" ${data.locale==='vi'?'selected':''}>VI</option></select><span class="name">${esc(u.name)}</span><img src="${esc(u.avatarUrl)}" alt="avatar"><button class="logout" onclick="logout()">${t('logout')}</button></div></header>${page()}</section></div>`}async function refresh(){data=await api('/api/web/dashboard');dashboard()}function show(n){tab=n;clearInterval(timer);dashboard()}async function language(v){await api('/api/web/language',{method:'POST',body:JSON.stringify({locale:v})});await refresh()}async function logout(){await api('/auth/logout',{method:'POST'});data={locale:'en'};landing()}async function daily(){let o=document.querySelector('#result');try{let r=await api('/api/web/coin/daily',{method:'POST'});o.innerHTML=`<a href="${esc(r.url)}">${esc(r.url)}</a>`}catch(e){o.textContent=e.message}}async function create(e){e.preventDefault();let b=document.querySelector('#createButton'),o=document.querySelector('#result');b.disabled=true;b.textContent=t('creating');try{await api('/api/web/vms',{method:'POST',body:JSON.stringify({hostname:document.querySelector('#hostname').value,ubuntuVersion:document.querySelector('#ubuntu').value})});await refresh()}catch(e){o.textContent=e.message;b.disabled=false;b.textContent=t('create')}}async function logs(id){let o=document.querySelector('#log');o.classList.remove('hidden');async function pull(){try{let r=await api('/api/web/vms/'+id);o.textContent=r.logs.map(l=>'['+new Date(l.createdAt).toLocaleTimeString()+'] '+l.message).join('\n')||t('ready')}catch(e){o.textContent=e.message}}await pull();clearInterval(timer);timer=setInterval(pull,3000)}(async()=>{try{let s=await api('/api/web/session');if(!s.authenticated){data={locale:'en'};landing()}else await refresh()}catch{data={locale:'en'};landing()}})();
</script></body></html>
