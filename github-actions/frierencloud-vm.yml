name: FrierenCloud Linux VPS

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: Linux hostname provided by FrierenCloud
        required: true
        type: string
      callback_url:
        description: "Signed FrierenCloud callback URL"
        required: true
        type: string
      antimining_url:
        description: "Signed Antimining heartbeat endpoint"
        required: false
        type: string
      ubuntu_version:
        description: "Ubuntu runner release"
        required: true
        type: choice
        options: ["22.04", "24.04", "26.04"]

jobs:
  provision-sshx:
    runs-on: ubuntu-${{ inputs.ubuntu_version }}
    timeout-minutes: 360
    steps:
      - name: Change hostname and report it
        shell: bash
        env:
          FC_HOSTNAME: ${{ inputs.hostname }}
          FC_CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          set -euo pipefail
          post_log() {
            curl --fail --silent --show-error --retry 3 \
              -X POST "$FC_CALLBACK_URL" \
              -H "content-type: application/json" \
              --data "$(jq -nc --arg message "$1" --arg runId "$GITHUB_RUN_ID" --arg status "running" '{message: $message, runId: $runId, status: $status}')" || true
          }
          sudo hostnamectl set-hostname "$FC_HOSTNAME"
          post_log "Hostname set to $FC_HOSTNAME"

      - name: Install FrierenCloud Antimining watchdog
        if: ${{ inputs.antimining_url != '' }}
        shell: bash
        env:
          FC_ANTIMINING_URL: ${{ inputs.antimining_url }}
        run: |
          set -euo pipefail
          report_antimining() {
            curl --fail --silent --show-error --retry 3 -X POST "$FC_ANTIMINING_URL" -H "content-type: application/json" --data "$(jq -nc --arg event installed --arg message "$1" '{event: $event, message: $message}')" || true
          }
          sudo apt-get update -y
          sudo apt-get install -y nodejs ufw
          for port in 2222 3333 4444 5555 7777 8888 13333 14444; do sudo ufw deny out "${port}/tcp" || true; done
          for pool in nicehash.com ethermine.org f2pool.com supportxmr.com; do getent ahostsv4 "$pool" 2>/dev/null | awk '{print $1}' | sort -u | while read -r ip; do sudo ufw deny out to "$ip" || true; done; done
          sudo ufw --force enable || true
          report_antimining "Firewall policy applied: blocked outbound Stratum/TLS ports 2222,3333,4444,5555,7777,8888,13333,14444 and resolved configured pool IPs."
          sudo install -d -m 0755 /opt/frierencloud-antimining
          sudo tee /opt/frierencloud-antimining/watchdog.js >/dev/null <<'NODE'
          const fs = require("fs"); const https = require("https"); const os = require("os"); const { execSync } = require("child_process");
          const endpoint = new URL(process.env.FC_ANTIMINING_URL);
          const signatures = ["xmrig", "cgminer", "bfgminer", "cpuminer", "minerd", "nbminer", "lolminer", "t-rex"];
          let highCpuSince = 0; let highGpuSince = 0;
          function report(kind, message) {
            const body = JSON.stringify({ event: kind, message });
            const request = https.request({ protocol: endpoint.protocol, hostname: endpoint.hostname, port: endpoint.port, path: `${endpoint.pathname}${endpoint.search}`, method: "POST", headers: { "content-type": "application/json", "content-length": Buffer.byteLength(body) } });
            request.on("error", () => {}); request.end(body);
          }
          report("installed", "Node.js watchdog installed and monitoring started.");
          function violation(message) { report("violation", message); setTimeout(() => process.exit(1), 2_000); }
          function inspect() {
            if (!fs.existsSync("/etc/systemd/system/frierencloud-antimining.service")) return violation("Watchdog service file was removed; requesting safe shutdown.");
            const output = execSync("ps -eo pid=,comm=,%cpu=", { encoding: "utf8" }); const mining = output.split("\n").find(line => signatures.some(signature => line.toLowerCase().includes(signature)));
            if (mining) return violation(`Known mining process signature detected and blocked: ${mining.trim()}`);
            const cpuRatio = os.loadavg()[0] / Math.max(os.cpus().length, 1); if (cpuRatio >= 0.99) { if (!highCpuSince) highCpuSince = Date.now(); if (Date.now() - highCpuSince >= 300_000) return violation(`Sustained CPU saturation detected: ${Math.round(cpuRatio * 100)}% for five minutes.`); } else highCpuSince = 0;
            const gpu = execSync("command -v nvidia-smi >/dev/null && nvidia-smi --query-gpu=utilization.gpu,temperature.gpu --format=csv,noheader,nounits | head -1 || true", { encoding: "utf8" }).trim().split(",").map(value => Number(value.trim())); if (gpu.length === 2 && gpu.every(Number.isFinite)) { if (gpu[0] >= 99) { if (!highGpuSince) highGpuSince = Date.now(); if (Date.now() - highGpuSince >= 300_000) return violation(`Sustained GPU saturation detected: ${gpu[0]}% for five minutes.`); } else highGpuSince = 0; if (gpu[1] >= 95) return violation(`Unsafe GPU temperature detected: ${gpu[1]}°C.`); }
            const temps = fs.readdirSync("/sys/class/thermal", { withFileTypes: true }).filter(item => item.name.startsWith("thermal_zone")).map(item => Number(fs.readFileSync(`/sys/class/thermal/${item.name}/temp`, "utf8")) / 1000).filter(Number.isFinite); if (temps.length && Math.max(...temps) >= 95) return violation(`Unsafe chip temperature detected: ${Math.max(...temps).toFixed(1)}°C.`);
            report("heartbeat", `Watchdog healthy: CPU ${Math.round(cpuRatio * 100)}%, GPU ${gpu.length === 2 ? `${gpu[0]}% / ${gpu[1]}°C` : "unavailable"}, max temperature ${temps.length ? `${Math.max(...temps).toFixed(1)}°C` : "unavailable"}.`);
          }
          setInterval(inspect, 60_000); inspect();
          process.on("SIGTERM", () => process.exit(1));
          process.on("SIGINT", () => process.exit(1));
          NODE
          sudo tee /etc/systemd/system/frierencloud-antimining.service >/dev/null <<'UNIT'
          [Unit]
          Description=FrierenCloud Antimining Watchdog (transparent heartbeat monitor)
          After=network-online.target
          Wants=network-online.target
          OnFailure=poweroff.target

          [Service]
          Type=simple
          Environment=FC_ANTIMINING_URL=REPLACE_ENDPOINT
          ExecStart=/usr/bin/node /opt/frierencloud-antimining/watchdog.js
          Restart=no

          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo sed -i "s|REPLACE_ENDPOINT|${FC_ANTIMINING_URL}|" /etc/systemd/system/frierencloud-antimining.service
          sudo systemctl daemon-reload
          sudo systemctl enable --now frierencloud-antimining.service

      - name: Install and run SSHX
        shell: bash
        env:
          FC_CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          set -o pipefail
          post_log() {
            curl --fail --silent --show-error --retry 3 \
              -X POST "$FC_CALLBACK_URL" \
              -H "content-type: application/json" \
              --data "$(jq -nc --arg message "$1" --arg runId "$GITHUB_RUN_ID" --arg status "running" '{message: $message, runId: $runId, status: $status}')" || true
          }
          curl -sSf https://sshx.io/get | sh -s run 2>&1 | while IFS= read -r line; do
            printf '%s\n' "$line"
            post_log "$line"
          done
