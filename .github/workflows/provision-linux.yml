name: Provision FrierenCloud Linux Session

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: Lowercase hostname for the temporary Linux runner
        required: true
        type: string

permissions:
  contents: read

jobs:
  provision:
    name: Linux session ${{ inputs.hostname }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate requested hostname
        env:
          REQUESTED_HOSTNAME: ${{ inputs.hostname }}
        shell: bash
        run: |
          if ! [[ "$REQUESTED_HOSTNAME" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
            echo "Invalid hostname. Use lowercase letters, numbers, and hyphens only."
            exit 1
          fi

      - name: Install required system packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends curl ca-certificates

      - name: Set temporary runner hostname
        env:
          REQUESTED_HOSTNAME: ${{ inputs.hostname }}
        shell: bash
        run: |
          sudo hostnamectl set-hostname "$REQUESTED_HOSTNAME"
          echo "Hostname set to: $(hostname)"

      - name: Install and run SSHX
        shell: bash
        run: |
          echo "Installing SSHX. The URL printed below grants temporary terminal access until this GitHub Actions job ends."
          curl -sSf https://sshx.io/get | sh && sshx
