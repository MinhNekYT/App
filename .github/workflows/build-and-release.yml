name: Build and Release FrierenCloud

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version, for example 1.0.0
        required: true
        default: 1.0.0
        type: string
      platform:
        description: Build target
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios

permissions:
  contents: write

concurrency:
  group: frierencloud-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish Version ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      APP_VERSION: ${{ inputs.version }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_GITHUB_REPOSITORY: ${{ secrets.EXPO_PUBLIC_GITHUB_REPOSITORY }}
      EXPO_PUBLIC_BRIDGE_URL: ${{ secrets.EXPO_PUBLIC_BRIDGE_URL }}
      # Optional: a user-created PAT may be stored as RELEASE_GITHUB_TOKEN.
      # If absent, the built-in github.token is used for the release.
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
    steps:
      - name: Validate release version
        shell: bash
        run: |
          if ! [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "The version must use semantic version format, for example 1.0.0."
            exit 1
          fi

      - name: Install required system packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends curl jq unzip git ca-certificates

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install project packages
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm check
          pnpm test

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$EXPO_TOKEN" || (echo "Missing EXPO_TOKEN repository secret." && exit 1)
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || (echo "Missing EXPO_PUBLIC_SUPABASE_URL repository secret." && exit 1)
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || (echo "Missing EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY repository secret." && exit 1)
          test -n "$EXPO_PUBLIC_GITHUB_REPOSITORY" || (echo "Missing EXPO_PUBLIC_GITHUB_REPOSITORY repository secret." && exit 1)
          test -n "$EXPO_PUBLIC_BRIDGE_URL" || (echo "Missing EXPO_PUBLIC_BRIDGE_URL repository secret." && exit 1)

      - name: Link or initialize EAS project
        run: pnpm dlx eas-cli@latest init --force --non-interactive

      - name: Build Android and/or iOS on EAS
        shell: bash
        run: |
          mkdir -p .ci-artifacts
          if [[ "${{ inputs.platform }}" == "all" || "${{ inputs.platform }}" == "android" ]]; then
            APP_VERSION="$APP_VERSION" pnpm dlx eas-cli@latest build --platform android --profile production --non-interactive --wait --json > .ci-artifacts/android-build.json
            node scripts/download-eas-artifact.mjs .ci-artifacts/android-build.json .ci-artifacts/FrierenCloud-${APP_VERSION}-android.apk
          fi
          if [[ "${{ inputs.platform }}" == "all" || "${{ inputs.platform }}" == "ios" ]]; then
            APP_VERSION="$APP_VERSION" pnpm dlx eas-cli@latest build --platform ios --profile production --non-interactive --wait --json > .ci-artifacts/ios-build.json
            node scripts/download-eas-artifact.mjs .ci-artifacts/ios-build.json .ci-artifacts/FrierenCloud-${APP_VERSION}-ios.ipa
          fi

      - name: Publish artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(.ci-artifacts/*.apk .ci-artifacts/*.ipa)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No APK or IPA artifact was downloaded."
            exit 1
          fi
          gh release create "v${APP_VERSION}" "${artifacts[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Version ${APP_VERSION}" \
            --notes "FrierenCloud build ${APP_VERSION}; generated by GitHub Actions." \
            --target "${GITHUB_SHA}"
