name: Build and Release FrierenCloud Web

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version, for example 1.0.0
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: write

concurrency:
  group: frierencloud-web-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build website and publish Version ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ inputs.version }}
      EXPO_PUBLIC_GITHUB_REPOSITORY: ${{ secrets.EXPO_PUBLIC_GITHUB_REPOSITORY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
    steps:
      - name: Validate release version
        shell: bash
        run: |
          if ! [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "The version must use semantic version format, for example 1.0.0."
            exit 1
          fi

      - name: Install required system packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zip ca-certificates

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install project packages
        run: pnpm install --frozen-lockfile

      - name: Verify and export website
        run: |
          pnpm check
          pnpm test
          pnpm web:build
          mv dist "FrierenCloud-${APP_VERSION}-web"
          zip -r "FrierenCloud-${APP_VERSION}-web.zip" "FrierenCloud-${APP_VERSION}-web"

      - name: Validate required configuration
        shell: bash
        run: |
          test -n "$EXPO_PUBLIC_GITHUB_REPOSITORY" || (echo "Missing EXPO_PUBLIC_GITHUB_REPOSITORY repository secret." && exit 1)
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || (echo "Missing EXPO_PUBLIC_SUPABASE_URL repository secret." && exit 1)
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || (echo "Missing EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY repository secret." && exit 1)

      - name: Publish website archive to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        shell: bash
        run: |
          gh release create "v${APP_VERSION}" "FrierenCloud-${APP_VERSION}-web.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Version ${APP_VERSION}" \
            --notes "FrierenCloud web build ${APP_VERSION}; generated by GitHub Actions." \
            --target "${GITHUB_SHA}"
